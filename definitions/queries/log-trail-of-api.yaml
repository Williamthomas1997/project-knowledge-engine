kind: QueryTemplate
id: log-trail-of-api
version: 1.1.0
description: >-
  The log statements an API can write, in call order: its handler's call tree (up to 4 hops, nearest methods first),
  then each method's log statements in source order. Call sites carry no order, so methods at the same depth are
  ordered by signature.
intents: ["log-trail"]
keywords: ["log", "logs", "logging", "trail", "trace", "debug", "troubleshoot"]
seedTypes: ["ApiOperation"]
default: false
parameters: { seedId: { required: true }, limit: { default: 50, max: 200 } }
cypher: |
  MATCH (api:ApiOperation {pke_id: $seedId})-[:HANDLED_BY]->(h:JavaMethod)
  MATCH path = (h)-[:CALLS*0..4]->(m:JavaMethod)
  WITH m, min(length(path)) AS hops
  MATCH (m)-[l:LOGS]->(log:LogStatement)
  RETURN log.pke_id AS id, 'ENTITY' AS kind, 'LogStatement' AS type, log.level + ' ' + log.template AS label,
         m.fqcn + '#' + m.signature AS detail, hops AS depth
  ORDER BY hops, m.signature, log.order
  LIMIT $limit
