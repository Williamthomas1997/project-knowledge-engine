kind: EntityType
name: JavaMethod
version: 1.1.0
description: A method or constructor, identified by repository, declaring type and erased signature.
category: technical
properties:
  repository: { type: string, required: true }
  fqcn: { type: string, required: true }
  signature: { type: string, required: true, description: "Erased signature, e.g. transfer(String,BigDecimal)" }
  summary: { type: text }
  lineStart: { type: integer }
  lineEnd: { type: integer }
  returnType: { type: string }
  annotations: { type: string-list }
  bodyHash: { type: string, description: Hash of the normalised body; used for rename detection }
  unresolvedCalls: { type: string-list, description: Calls the symbol solver could not resolve (never guessed) }
  test: { type: boolean }
identity: { strategy: naturalKey, naturalKey: [repository, fqcn, signature] }
embedding: { indexFields: [summary] }
retrieval: { displayProperty: signature }
